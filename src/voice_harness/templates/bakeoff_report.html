<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* Standalone bake-off report: the shared renderer and stylesheet are inlined below; no network is used. */
:root { --bg:#f5f6f8; --card:#fff; --fg:#151a22; --muted:#5b6575; --line:#d9dde4; --ok:#0b6b3a; --bad:#b0261c; --warn:#8a5a00; --info:#1d4e9e; color-scheme:light }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg:#11151b; --card:#1a2029; --fg:#e7ebf1; --muted:#9aa5b5; --line:#2c3441; --ok:#5fd394; --bad:#ff8d85; --warn:#f0b94d; --info:#8db8ff; color-scheme:dark } }
:root[data-theme=dark] { --bg:#11151b; --card:#1a2029; --fg:#e7ebf1; --muted:#9aa5b5; --line:#2c3441; --ok:#5fd394; --bad:#ff8d85; --warn:#f0b94d; --info:#8db8ff; color-scheme:dark }
:root[data-theme=light] { color-scheme:light }
.theme-bar { max-width:1180px; margin:0 auto; padding:12px 16px 0; display:flex; justify-content:flex-end }
.theme-bar label { color:var(--muted); font-size:.8rem; display:flex; gap:6px; align-items:center }
.theme-bar select { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 8px; min-height:32px }
@media print { .theme-bar { display:none } }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif }
#report { max-width:1180px; margin:0 auto; padding:28px 16px 60px }
#report h1 { font-size:1.9rem; line-height:1.2; letter-spacing:-.01em; text-wrap:balance }
footer { max-width:1180px; margin:0 auto; padding:0 16px 40px; color:var(--muted); font-size:.78rem }
@media print { body { background:#fff } }
__CSS__
</style>
</head>
<body>
<div class="theme-bar"><label>Theme <select id="theme-select" aria-label="Colour theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div>
<main id="report"></main>
<footer id="footer"></footer>
<script type="application/json" id="report-data">__DATA__</script>
<script type="module">
__RENDERER__
{ const sel = document.getElementById("theme-select"), root = document.documentElement;
  const apply = (v) => { if (v === "light" || v === "dark") root.dataset.theme = v; else delete root.dataset.theme; };
  let saved = "auto"; try { saved = localStorage.getItem("harness-theme") || "auto"; } catch {}
  if (!["auto", "light", "dark"].includes(saved)) saved = "auto";
  sel.value = saved; apply(saved);
  sel.addEventListener("change", () => { apply(sel.value); try { localStorage.setItem("harness-theme", sel.value); } catch {} }); }
const data = JSON.parse(document.getElementById("report-data").textContent);
const view = renderReport(document.getElementById("report"), data);
document.getElementById("footer").textContent = `Generated by Voice Harness from the run ledger (${data.source}). Every number is computed from recorded run evidence; run IDs are in the scenario matrix. Dimension weights are fixed as shown here; the what-if weights editor is only on the operator Bake-off page.`;
let pending;
window.addEventListener("resize", () => { clearTimeout(pending); pending = setTimeout(view.redraw, 150); });
window.addEventListener("beforeprint", view.showAll);
window.addEventListener("afterprint", view.restoreView);
</script>
</body>
</html>
