<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work log — Voice Harness</title>
<link rel="stylesheet" href="../site/theme.css">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 'DM Sans',system-ui,sans-serif}
header,main{max-width:900px;margin:auto;padding:0 24px}
header{display:flex;align-items:center;justify-content:space-between;height:80px;border-bottom:1px solid var(--line)}
a{color:var(--accent)}h1{font-size:28px;margin:32px 0 8px}
.hint{color:var(--muted);font-size:13px}
ul{list-style:none;padding:0}li{border-top:1px solid var(--line)}li a{display:flex;justify-content:space-between;gap:16px;padding:14px 4px;text-decoration:none;color:var(--ink)}
li a:hover{background:var(--tint)}li small{color:var(--muted)}
article{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 24px 24px;margin-top:24px}
article h1,article h2,article h3{margin-top:1.4em}article code{background:var(--tint);padding:1px 5px;border-radius:3px}
</style></head><body>
<header><strong>Work log</strong><a href="../index.html">← Evidence hub</a></header>
<main>
<h1>Work log</h1>
<p class="hint">Notes live in this folder as Markdown files. Add one with <code>python3 work-logs/new_log.py "Title"</code>; see README.md.</p>
<ul id="list"><li class="hint">Loading…</li></ul>
<div id="entry"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Small Markdown subset: headings, bullets, bold, code, links, paragraphs.
function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
  let out='',list=false;
  for(const line of src.split('\n')){
    const h=line.match(/^(#{1,3})\s+(.*)/),b=line.match(/^[-*]\s+(.*)/);
    if(list&&!b){out+='</ul>';list=false}
    if(h)out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if(b){if(!list){out+='<ul style="list-style:disc;padding-left:1.4em">';list=true}out+=`<li style="border:0">${inline(b[1])}</li>`}
    else if(line.trim())out+=`<p>${inline(line)}</p>`;
  }
  return out+(list?'</ul>':'');
}
async function show(file){
  try{const r=await fetch(file);if(!r.ok)throw 0;$('entry').innerHTML='<article>'+md(await r.text())+'</article>';}
  catch{$('entry').innerHTML='<p class="hint">Could not load '+esc(file)+'. Serve this folder over HTTP (python3 serve.py).</p>'}
}
fetch('logs.json').then(r=>r.json()).then(logs=>{
  $('list').innerHTML=logs.length?logs.map(l=>`<li><a href="#${encodeURIComponent(l.file)}"><span>${esc(l.title)}</span><small>${esc(l.date)}</small></a></li>`).join(''):'<li class="hint">No entries yet.</li>';
  const go=()=>{const f=decodeURIComponent(location.hash.slice(1));if(f)show(f)};
  addEventListener('hashchange',go);go();
}).catch(()=>{$('list').innerHTML='<li class="hint">Serve this folder over HTTP (python3 serve.py) to read the log.</li>'});
</script></body></html>
