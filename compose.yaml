name: voice-harness

x-sandbox: &sandbox
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m,mode=1777
  mem_limit: 512m
  cpus: 2
  pids_limit: 128

services:
  harness:
    <<: *sandbox
    build:
      context: .
      target: runtime
    volumes:
      - evidence:/data

  api:
    <<: *sandbox
    mem_limit: 2g
    build:
      context: .
      target: runtime
    command: [serve]
    environment:
      HARNESS_DATABASE_URL: postgresql://harness@postgres/voice_harness
      HARNESS_DB_PASSWORD_FILE: /run/secrets/postgres_password
      HARNESS_BIND: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets: [postgres_password]
    ports: ["127.0.0.1:8765:8000"]
    volumes: ["evidence:/data"]
    depends_on:
      postgres:
        condition: service_healthy

  benchmark:
    <<: *sandbox
    cpus: 8
    mem_limit: 1g
    profiles: [benchmark]
    build:
      context: .
      target: runtime
    command: [benchmark]
    environment:
      HARNESS_DATABASE_URL: postgresql://harness@postgres/voice_harness
      HARNESS_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["evidence:/data"]
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    <<: *sandbox
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      HARNESS_TEST_DATABASE_URL: postgresql://harness@postgres/voice_harness
      HARNESS_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  # Opt-in live Nova conformance (make nova-live-container). Credentials mounted read-only at run time only.
  nova-live:
    <<: *sandbox
    profiles: [live]
    build:
      context: .
      target: test
    environment:
      VOICE_HARNESS_LIVE_ADAPTERS: aws_nova_sonic
      HARNESS_AWS_SESSION_ENV: /run/secrets/aws-session.env
      HOME: /tmp
    volumes:
      - ./.local/aws-session.env:/run/secrets/aws-session.env:ro
    command: [python, -m, unittest, tests.adapter_conformance.LiveConformance, -v]

  postgres:
    image: public.ecr.aws/docker/library/postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: voice_harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U harness -d voice_harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  browser-tests:
    <<: *sandbox
    profiles: [test]
    build:
      context: .
      target: browser-test
    network_mode: none

  otel-collector:
    profiles: [infra]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.137.0@sha256:089a8b3c81d328a190f6f0740b30c15b0c7f1f2cfeadeb810355574d5158b31c
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true

volumes:
  evidence:
  postgres-data:

secrets:
  postgres_password:
    file: .local/postgres-password
