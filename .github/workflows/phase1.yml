name: Phase 1 deterministic checks
on: [push, pull_request]
jobs:
  container-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          cache-dependency-glob: requirements.lock
      - run: make lint
      - run: make audit
      # Anonymous pulls from the public registry are rate-limited per runner IP; keep the pinned images in the cache.
      - id: images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ci-images
          key: images-${{ hashFiles('compose.yaml', 'Dockerfile') }}
      - name: Load or pull pinned images (retry on rate limit)
        run: |
          if [ -f .ci-images/images.tar ]; then
            docker load -i .ci-images/images.tar
          else
            for attempt in 1 2 3 4 5; do
              docker compose --profile infra pull --ignore-buildable postgres otel-collector && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 30))
            done
            mkdir -p .ci-images
            docker save -o .ci-images/images.tar $(docker compose --profile infra config --images | grep -E 'postgres|opentelemetry')
          fi
      - run: make test
        env:
          SECRET_MODE: "644"
      - run: make perf-gate
        env:
          SECRET_MODE: "644"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: perf-run
          path: .local/perf-run.json
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --tail=100 postgres
      - if: always()
        run: docker compose --profile infra down
