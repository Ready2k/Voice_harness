name: Phase 1 deterministic checks
on: [push, pull_request]
jobs:
  container-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: requirements.lock
      - run: make lint
      - run: make audit
      - name: Pre-pull images (public registries rate-limit anonymous pulls; retry)
        run: |
          for attempt in 1 2 3 4; do
            docker compose --profile infra pull --ignore-buildable postgres otel-collector && exit 0
            sleep $((attempt * 30))
          done
          exit 1
      - run: make test
        env:
          SECRET_MODE: "644"
      - if: failure()
        run: docker compose logs --tail=100 postgres
      - if: always()
        run: docker compose --profile infra down
