[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-harness"
version = "0.1.0"
description = "Credential-free deterministic core for realtime voice evaluation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.6",
  "jsonschema==4.26.0", "httpx==0.28.1", "websockets==17.2", "mcp==2.3.0",
  "psycopg-pool==3.3.3",
  "cryptography==50.0.2", "numpy==2.5.4", "soxr==1.1.0",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "boto3==1.43.118"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["contracts", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S311", "S608"]  # S311/S608: seeded fixtures and internal table names (reviewed)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311", "B608"]
