[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-harness"
version = "0.1.0"
description = "Credential-free deterministic core for realtime voice evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "psycopg[binary]==3.3.6",
  "jsonschema==4.26.0", "httpx==0.28.1", "websockets==17.2", "mcp==1.30.0",
  "psycopg-pool==3.3.3",
  "cryptography==50.0.2",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
